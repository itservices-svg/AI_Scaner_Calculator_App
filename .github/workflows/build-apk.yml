name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name handwrite_ai --org com.itservices .

      - name: Set minSdk 26 (tflite_flutter) and app label
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 26/; s/minSdkVersion +flutter\.minSdkVersion/minSdkVersion 26/' "$f"
          done
          sed -i 's/android:label="[^"]*"/android:label="HandWrite AI"/' android/app/src/main/AndroidManifest.xml
          grep -n "minSdk" android/app/build.gradle* || true

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk HandWriteAI.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandWriteAI-apk
          path: HandWriteAI.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HandWrite AI v1.0.${{ github.run_number }}
          files: HandWriteAI.apk
          generate_release_notes: true
